<style>
/* === FORCE BLACK & WHITE THEME === */
*, *::before, *::after {
  --background: 0 0% 0% !important;
  --foreground: 0 0% 100% !important;
  --card: 0 0% 8% !important;
  --card-foreground: 0 0% 100% !important;
  --popover: 0 0% 8% !important;
  --popover-foreground: 0 0% 100% !important;
  --primary: 0 0% 100% !important;
  --primary-foreground: 0 0% 0% !important;
  --secondary: 0 0% 15% !important;
  --secondary-foreground: 0 0% 100% !important;
  --muted: 0 0% 15% !important;
  --muted-foreground: 0 0% 60% !important;
  --accent: 0 0% 15% !important;
  --accent-foreground: 0 0% 100% !important;
  --destructive: 0 84% 60% !important;
  --border: 0 0% 20% !important;
  --input: 0 0% 15% !important;
  --ring: 0 0% 70% !important;
}

html, body, #root {
  background-color: #000 !important;
  color: #fff !important;
}

/* Override all background colors */
[class*="bg-slate"], [class*="bg-blue"], [class*="bg-indigo"], [class*="bg-navy"] {
  background-color: #111 !important;
}

/* Cards and surfaces */
.bg-card, [class*="bg-card"] { background-color: #111 !important; }
.bg-background, [class*="bg-background"] { background-color: #000 !important; }

/* Override blue/navy inline styles and gradient backgrounds */
div[style*="background"] { background: #111 !important; }

/* Bottom nav */
nav, [role="navigation"] {
  background-color: #0a0a0a !important;
  border-top: 1px solid #333 !important;
}

/* Buttons - primary should be white */
button[class*="bg-primary"], .btn-primary {
  background-color: #fff !important;
  color: #000 !important;
}

/* The START FULL SETUP CHECKLIST button specifically */
button[class*="w-full"] {
  background-color: #fff !important;
  color: #000 !important;
  border: none !important;
}

/* Input fields */
input, textarea, select {
  background-color: #1a1a1a !important;
  border-color: #333 !important;
  color: #fff !important;
}

/* Section headers/cards with colored backgrounds */
[style*="color:#"], [style*="color: #"] {
  color: #fff !important;
}

/* Override any gradient that might be navy/blue/purple */
[style*="gradient"] {
  background: #111 !important;
}

/* Tab bar active state */
[class*="text-primary"] { color: #fff !important; }
[class*="text-muted"] { color: #888 !important; }

/* Borders */
[class*="border"] { border-color: #333 !important; }

/* Section colored left borders - keep as white accent */
[style*="borderLeft"], [style*="border-left"] {
  border-left-color: #555 !important;
}

/* Toggle/switch - make it white when active */
[role="switch"][data-state="checked"] {
  background-color: #fff !important;
}
[role="switch"][data-state="unchecked"] {
  background-color: #333 !important;
}

/* Top bar / header */
header, [class*="header"] {
  background-color: #000 !important;
  border-bottom-color: #333 !important;
}

/* Text colors */
h1, h2, h3, h4, h5, h6 { color: #fff !important; }
p, span, label { color: inherit !important; }

/* Badge/pill elements */
[class*="badge"], [class*="Badge"] {
  background-color: #222 !important;
  color: #fff !important;
  border-color: #444 !important;
}

/* Progress bar */
[role="progressbar"] > div {
  background-color: #fff !important;
}

/* Checklist section colors - override the teal/purple/blue/red section accents */
[style*="#16A085"], [style*="#8E44AD"], [style*="#2980B9"], [style*="#C0392B"] {
  background-color: #1a1a1a !important;
  color: #fff !important;
}
</style>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
